# ============================================================
# GoberVial - Nginx Virtual Host Config
# Dominio: gobovial.magdalena.gov.co (ajustar segun dominio real)
# SSL: Let's Encrypt via Certbot
# TLS: 1.3 forzado, 1.2 como fallback
# ============================================================

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    listen [::]:80;
    server_name gobovial.magdalena.gov.co www.gobovial.magdalena.gov.co;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS server ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name gobovial.magdalena.gov.co www.gobovial.magdalena.gov.co;

    # ==========================================
    # SSL / TLS Configuration (hardening)
    # ==========================================
    ssl_certificate     /etc/letsencrypt/live/gobovial.magdalena.gov.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gobovial.magdalena.gov.co/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/gobovial.magdalena.gov.co/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # ==========================================
    # Security headers (hardening)
    # ==========================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; frame-src 'self'; font-src 'self' https://unpkg.com; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    # ==========================================
    # Rate Limiting
    # ==========================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:5m rate=5r/m;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    limit_req zone=api_limit burst=20 nodelay;
    limit_conn conn_limit 10;

    # ==========================================
    # Logging
    # ==========================================
    access_log /var/log/nginx/gobevial-access.log;
    error_log  /var/log/nginx/gobevial-error.log;

    # ==========================================
    # Document root (Angular build output)
    # ==========================================
    root /var/www/gobervial/app;
    index index.html;

    # ==========================================
    # API Backend proxy (Node.js/Express)
    # ==========================================
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # Strict rate limit for login endpoint
    location /api/v1/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Serve uploaded evidence photos
    location /uploads/ {
        alias /var/www/gobervial/api/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ==========================================
    # Angular SPA fallback
    # ==========================================
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ==========================================
    # Block sensitive files
    # ==========================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(sql|log|md|sh|env|example|yml|yaml|json|lock)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # ==========================================
    # Gzip compression
    # ==========================================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;
}
